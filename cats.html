<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tandem · Cat studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#39251f;color:#ffebd1;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}main{height:100dvh;position:relative}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{font:32px Georgia,serif;margin:0 0 8px}p{margin:0;color:#dfbea0;max-width:440px;line-height:1.5}.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 18px;background:#30221ee8;border:1px solid #8a6045;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:min(760px,calc(100% - 32px))}button,select{font:inherit;color:#ffebd1;background:#65442f;border:1px solid #9b7050;border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#e8b27b;color:#39251f}label{display:flex;align-items:center;gap:8px}#message{position:absolute;top:28px;right:28px;font-size:13px;color:#dfbea0}#stage{height:100%}a{color:#ffd2a0}@media(max-width:600px){header{top:18px;left:20px}h1{font-size:25px}#message{top:125px;left:20px}.controls{bottom:12px;gap:6px}button,select{font-size:13px;padding:7px 9px}}
  </style>
</head>
<body><main><div id="stage"></div><header><h1>A little company for the journey</h1><p>Adult cat & kitten · Drag to turn, scroll to zoom.<br>Natural proportions, soft coats, warm window light.</p></header><div id="message" role="status">Loading cats…</div><div class="controls" aria-label="Cat animation controls"><div id="clips"></div><button id="pause" aria-pressed="false">Pause</button><label>Coat <select id="coat"><option value="cream">Cream & orange</option><option value="blue">Blue-gray</option></select></label></div></main><script type="module" src="/src/cat-preview.js"></script></body>
</html>
